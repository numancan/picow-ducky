<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.classless.min.css">
    <style>
    
    @font-face {
        font-family: 'Minecraft';
        src: url('./fonts/Minecraft.ttf') format('truetype');
    }

    *, :root, h2, h3, input::-moz-placeholder, ::file-selector-button {
        font-family: Minecraft;
        color: #20C20E;
    }

    h2 {
        text-align: center;
    }

    h3 {
        margin-bottom: 1.5rem;
        padding-left: 0.3rem;
        background-color: #20C20E;
        border: #20C20E;
        color: black;
        /* text-align: center; */
    }

    [data-theme="dark"],
    :root:not([data-theme="light"]), :root:not(input[type="submit"]) {
        --background-color: #000000;
        --primary: #20C20E;
        --primary-hover: #20C20E;
        --primary-focus: #20c20e2e;
        --primary-inverse: #FFF;
    }

    input[type="submit"] {
        --background-color: var(--form-element-background-color);
    }

    input[value="delete"] {
        --background-color: rgb(174, 3, 3);
        --primary-hover: rgb(174, 3, 3);
        --primary-focus: rgb(174, 3, 3);
        --primary: red;
    }

    input[type="submit"], input[value="delete"] {
        transition: 0.05s linear;
    }

    input[type="submit"]:active, input[value="delete"]:active {
        transform: scale(.98);
    }
    </style>
    <title>picow_ducky</title>

</head>
<body>
    <main>
        <h2>welcome to <strong>picow_ducky</strong></h2>

        <section id="trigger-payload">
            <h3>Payloads</h3>
                <select id="payload-list" name="payload" required="">
                    <!--#payloads-->
                </select>
                <input type="submit" id="trigger-btn" onclick="post(`/trigger?p=${payloadList.value}`)" value="trigger">
                <input type="button" id="delete-btn" value="delete">
            <dialog id="delete-modal" style="display: none;" open>
                <article>
                  <p>
                    are you sure you want to delete this payload?
                  </p>
                  <footer>
                    <a id="delete-modal-cancel" href="#" role="button">Cancel</a>
                    <a id="delete-modal-confirm" onclick="post(`/delete?p=${payloadList.value}`,0 ,1,this)" href="#" role="button">Confirm</a>
                  </footer>
                </article>
              </dialog>
        </section>


        <section id="upload">
            <h3>Upload Ducky Script</h3>
            <input type="file" onchange="checkExtension('txt')" id="file-input" name="filename" accept=".txt">
            <input type="submit" id="upload-btn" onclick="post(`/upload?p=${fileInput.files[0].name}`, fileInput.files[0], 1)" value="upload">
        </section>

        <section>
            <h3>Settings</h3>
            <form action="/settings" method="POST" enctype="text/plain">
                <label for="wssid">Wifi SSID</label>
                <!--#wssid-->
    
                <label for="wpass">Wifi Password</label>
                <!--#wpass-->
    
                <label for="pname">Payload Name</label>
                <!--#pname-->

                <label for="pti">
                    Plug To Inject
                    <!--#pti-->
                    <input type="checkbox" role="switch" id="pti" onchange="document.getElementById('ptiH').value = this.checked">
                </label>
                <h3></h3>
                <input type="submit" value="submit">
            </form>
        </section>
    </main>

    <script>
        const payloadList = document.getElementById("payload-list");
        const uploadBtn = document.getElementById("upload-btn");
        const fileInput = document.getElementById("file-input");
        const deleteBtn = document.getElementById("delete-btn");
        const deleteModal = document.getElementById("delete-modal");
        const deleteModalConfirm = document.getElementById("delete-modal-confirm");
        const deleteModalCancel = document.getElementById("delete-modal-cancel");

        const getExtension = (filename) => filename.split(".").pop();
        const checkExtension = (extension) => { if(!(getExtension(fileInput.files[0].name) === extension)) fileInput.value =  ""}
        
        window.onclick = function(event) {
            if (event.target == deleteModal) {
                deleteModal.style.display = "none";
            }
        }

        async function post(uri, file, reload) {
            this.event.preventDefault();
            try {
                await fetch(`http://${window.location.host + uri}`, {
                "credentials": "omit",
                "method": "POST",
                "headers": {
                    "Accept": "text/html",
                    "Content-Type": "text/plain"
                },
                "body": file ?? "",
                }).then(res => reload && location.reload());
                
            } catch (error) {
                console.log(error);
            }
        }

        document.addEventListener("DOMContentLoaded", function(event) {
            deleteBtn.addEventListener("click", () => deleteModal.style.display = "flex" )
            deleteModalConfirm.addEventListener("click", () => deleteModal.style.display = "none")
            deleteModalCancel.addEventListener("click", () => deleteModal.style.display = "none" )
            document.getElementById("pti").checked = document.getElementById("ptiH").value === 'true' ? true : false;
            
            payloadList.innerHTML = payloadList.innerHTML.split(".txt").map((e) => { 
                e = e.trim(); 
                if (e) return `<option value="${e}.txt">${e}.txt</option>`
            }).join("")
        });
    </script>
</body>
</html>
